name: Evolve Othello Individuals

concurrency:
  group: evolve-othello
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      generations:
        description: "何世代分進めるか"
        required: false
        default: "5"
      population_size:
        description: "個体数（固定）"
        required: false
        default: "16"
      swiss_rounds:
        description: "スイス方式トーナメントのラウンド数"
        required: false
        default: "4"
      search_depth:
        description: "個体の探索深さ"
        required: false
        default: "4"
  schedule:
    - cron: "0 20 * * *"

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

            - name: Debug - check file structure
        run: |
          echo "=== ルート直下 ==="
          ls -la
          echo "=== othello_sim フォルダの中身 ==="
          ls -la othello_sim
          echo "=== individual.py の中身確認 ==="
          cat othello_sim/individual.py | head -3
          echo "=== Python import テスト ==="
          python -c "import othello_sim; print(othello_sim.__file__)"
          python -c "from othello_sim import individual"- name: Run evolution generation-by-generation (with per-batch push)
        timeout-minutes: 340
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_TARGET_DIR: ${{ secrets.XSERVER_TARGET_DIR }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          IMPORT_URL: "https://lab.spia-net.com/othello/import_from_colab.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
        run: |
          git config user.name "othello-sim-bot"
          git config user.email "actions@users.noreply.github.com"

          echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          TOTAL="${{ github.event.inputs.generations || '5' }}"
          POP_SIZE="${{ github.event.inputs.population_size || '16' }}"
          SWISS_ROUNDS="${{ github.event.inputs.swiss_rounds || '4' }}"
          SEARCH_DEPTH="${{ github.event.inputs.search_depth || '4' }}"

          for i in $(seq 1 "$TOTAL"); do
            echo "=== Running generation batch $i / $TOTAL ==="
            python -u run_evolution.py \
              --data-dir data \
              --generations 1 \
              --population-size "$POP_SIZE" \
              --swiss-rounds "$SWISS_ROUNDS" \
              --search-depth "$SEARCH_DEPTH"

            git add data/individuals.json data/matches.json data/training_state.json
            if ! git diff --staged --quiet; then
              git commit -m "Evolve: generation batch $i/$TOTAL [skip ci]"
              git pull --rebase origin main
              git push
            fi

            echo "--- Xserverへ反映中（バッチ $i）---"
            scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no \
              data/individuals.json data/matches.json data/training_state.json \
              "$XSERVER_USER@$XSERVER_HOST:$XSERVER_TARGET_DIR" \
              || echo "::warning::scpでの転送に失敗しました（バッチ $i）。次のバッチへ続行します"

            curl -sS -f "$IMPORT_URL" \
              || echo "::warning::インポートに失敗しました（バッチ $i）。次のバッチへ続行します"
          done

          rm -f /tmp/deploy_key
